<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="/Styles/main.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
   
    <div class="app-container">
      <!-- Header will be added later -->
      <main class="main-content">
        <div class="generator-card">
          <div class="card-header">
            <h2>QR Code Generator</h2>
            <p>Create custom QR codes in seconds</p>
          </div>

          <div class="card-body">
            <div class="form-section">
              <div class="form-group">
                <label for="qrType">QR Code Type</label>
                <select id="qrType" class="form-control">
                  <option value="text">Text</option>
                  <option value="url">URL</option>
                  <option value="contact">Contact</option>
                  <option value="image">Image</option>
                  <option value="wifi">Wi-Fi</option>
                </select>
              </div>

              <div id="inputFields" class="input-fields">
                <!-- Dynamic fields will appear here -->
              </div>

              <div class="form-group">
                <label>Customization</label>
                <div class="customization-options">
                  <div class="color-picker">
                    <span>Foreground</span>
                    <input type="color" id="fgColor" value="#000000" />
                  </div>
                  <div class="color-picker">
                    <span>Background</span>
                    <input type="color" id="bgColor" value="#ffffff" />
                  </div>
                  <div class="checkbox-option">
                    <input type="checkbox" id="editableOption" />
                    <label for="editableOption">Editable QR Code</label>
                  </div>
                </div>
              </div>
            </div>

            <div class="preview-section">
              <div class="qr-preview" id="qrResult">
                <div class="placeholder">
                  <i class="fas fa-qrcode"></i>
                  <p>Your QR code will appear here</p>
                </div>
              </div>
              <div class="action-buttons">
                <button id="generateBtn" class="btn-primary">
                  <i class="fas fa-bolt"></i> Generate QR Code
                </button>
                <button id="downloadBtn" class="btn-secondary" disabled>
                  <i class="fas fa-download"></i> Download
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="/scripts/main.js"></script>
  </body>
</html>
